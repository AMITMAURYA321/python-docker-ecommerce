services:

  backend:
    build: ./backend
    container_name: ecommerce-api
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

    security_opt:
    - no-new-privileges:true

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    networks:
      - ecommerce-network

  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
   
    volumes:
      - ecommerce-mysql-data:/var/lib/mysql
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ecommerce", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ecommerce-network

  nginx:
    build: ./nginx
    container_name: ecommerce-nginx
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network

volumes:
  ecommerce-mysql-data:

networks:
  ecommerce-network:
